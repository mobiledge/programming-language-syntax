<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Language Syntax</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/haskell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elixir.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/fsharp.min.js"></script>
</head>
<body>

<div class="site-header">
  <h1>Programming Language Syntax</h1>
  <a class="github-link" href="https://github.com/mobiledge/programming-language-syntax" target="_blank" rel="noopener">
    <img src="https://cdn.simpleicons.org/github" width="18" height="18" alt="GitHub">
    GitHub
  </a>
</div>

<div class="filters">
  <div class="filter-group">
    <label>Topic</label>
    <div class="pill-group" id="topic-pills"></div>
  </div>
  <div class="filter-group">
    <label>Language</label>
    <div class="lang-section" id="lang-section"></div>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const topics = [
  { slug: "functions",        label: "Functions"        },
  { slug: "closures",         label: "Closures"         },
  { slug: "structs",          label: "Structs"           },
  { slug: "pattern-matching", label: "Pattern Matching"  },
  { slug: "error-handling",   label: "Error Handling"    },
  { slug: "generics",         label: "Generics"          },
  { slug: "interfaces",       label: "Interfaces/Traits" },
  { slug: "enums",            label: "Enums"             },
];

const SI  = n => `https://cdn.simpleicons.org/${n}`;
const DI  = n => `https://cdn.jsdelivr.net/gh/devicons/devicon/icons/${n}/${n}-original.svg`;

const langs = {
  csharp:     { label: "C#",         icon: DI("csharp")      },
  elixir:     { label: "Elixir",     icon: DI("elixir")      },
  fsharp:     { label: "F#",         icon: SI("fsharp")      },
  gleam:      { label: "Gleam",      icon: "icons/gleam.png" },
  haskell:    { label: "Haskell",    icon: SI("haskell")     },
  java:       { label: "Java",       icon: DI("java")        },
  javascript: { label: "JavaScript", icon: SI("javascript")  },
  kotlin:     { label: "Kotlin",     icon: SI("kotlin")      },
  python:     { label: "Python",     icon: SI("python")      },
  ruby:       { label: "Ruby",       icon: SI("ruby")        },
  scala:      { label: "Scala",      icon: SI("scala")       },
  swift:      { label: "Swift",      icon: SI("swift")       },
  typescript: { label: "TypeScript", icon: SI("typescript")  },
};

function iconImg(icon, size = 16) {
  return icon
    ? `<img src="${icon}" alt="" style="width:${size}px;height:${size}px;flex-shrink:0;vertical-align:middle;">`
    : `<span style="display:inline-block;width:${size}px;height:${size}px;flex-shrink:0;"></span>`;
}

function extractCode(text) {
  const match = text.match(/^```[^\n]*\n([\s\S]*?)^```/m);
  return match ? match[1].replace(/\n$/, "") : "";
}

function extractDocs(text) {
  const match = text.match(/^\[Docs\]\(([^)]+)\)/m);
  return match ? match[1] : null;
}

let snippets = [];

const langCategories = [
  {
    label: "Paradigm",
    groups: [
      { label: "Imperative", langs: ["swift", "kotlin", "java", "csharp", "ruby", "python", "javascript", "typescript"] },
      { label: "Functional",      langs: ["haskell", "fsharp", "scala", "elixir", "gleam"] }
    ]
  },
  {
    label: "Type System",
    groups: [
      { label: "Static",  langs: ["swift", "kotlin", "java", "csharp", "haskell", "fsharp", "scala", "gleam", "typescript"] },
      { label: "Dynamic", langs: ["ruby", "python", "elixir", "javascript"] }
    ]
  }
];

let activeTopic = topics[0].label;
let activeLangs = new Set(Object.values(langs).map(l => l.label));

function render() {
  // Topic pills
  document.getElementById("topic-pills").innerHTML = topics.map(t =>
    `<span class="pill ${t.label === activeTopic ? 'active' : ''}" data-topic="${t.label}">${t.label}</span>`
  ).join("");

  // Language section
  const categoryRows = langCategories.map((cat, ci) =>
    `<div class="lang-category-row">
      <span class="category-label">${cat.label}</span>
      ${cat.groups.map((group, gi) =>
        `<span class="group-toggle" data-cat="${ci}" data-group="${gi}">${group.label}</span>`
      ).join("")}
    </div>`
  ).join("");

  const pills = Object.values(langs).map(({label, icon}) =>
    `<span class="pill ${activeLangs.has(label) ? 'active' : ''}" data-lang="${label}">${iconImg(icon, 14)} ${label}</span>`
  ).join("");

  document.getElementById("lang-section").innerHTML = categoryRows + `<div class="lang-pills-row">${pills}</div>`;

  // Grid
  const filtered = snippets.filter(s => s.topic === activeTopic && activeLangs.has(s.lang));
  document.getElementById("grid").innerHTML = filtered.length
    ? filtered.map(s => `
        <div class="tile">
          <div class="tile-header">
            <span>${iconImg(s.icon)} ${s.lang}</span>
            ${s.docs ? `<a class="docs-link" href="${s.docs}" target="_blank" rel="noopener">Docs ↗</a>` : ""}
          </div>
          <pre><code class="language-${s.syntax || "plaintext"}">${s.code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}</code></pre>
        </div>`).join("")
    : `<p class="no-results">No snippets match the current filters.</p>`;

  document.getElementById("grid").querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
}

document.getElementById("topic-pills").addEventListener("click", e => {
  if (e.target.dataset.topic) { activeTopic = e.target.dataset.topic; render(); }
});

document.getElementById("lang-section").addEventListener("click", e => {
  if (e.target.dataset.cat !== undefined) {
    const group = langCategories[+e.target.dataset.cat].groups[+e.target.dataset.group];
    activeLangs = new Set(group.langs.map(s => langs[s].label));
    render(); return;
  }
  const l = e.target.dataset.lang;
  if (l) {
    if (activeLangs.has(l)) { if (activeLangs.size > 1) activeLangs.delete(l); }
    else activeLangs.add(l);
    render();
  }
});

Promise.all(
  topics.flatMap((t, i) =>
    Object.entries(langs).map(([slug, {label, icon}]) =>
      fetch(`${String(i + 1).padStart(2, "0")}-${t.slug}-${slug}.md`)
        .then(r => r.text())
        .then(text => ({ topic: t.label, lang: label, icon, syntax: slug, code: extractCode(text), docs: extractDocs(text) }))
    )
  )
).then(results => {
  snippets = results;
  render();
});
</script>
</body>
</html>
